name: Test coverage-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          results-path: ${{ github.workspace }}/hardened/tests/fixtures/passing_tests.trx
          coverage-path: ${{ github.workspace }}/hardened/tests/fixtures/coverage.opencover.xml
          coverage-type: opencover
          allow-failed-tests: 'true'
          post-new-comment: 'false'

      - name: Assert coverage outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL: ${{ steps.action.outputs.tests-total }}
          COVERAGE_LINE: ${{ steps.action.outputs.coverage-line }}
          COVERAGE_BRANCH: ${{ steps.action.outputs.coverage-branch }}
          LINES_TOTAL: ${{ steps.action.outputs.coverage-lines-total }}
          LINES_COVERED: ${{ steps.action.outputs.coverage-lines-covered }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tests-total: $TOTAL"
          echo "coverage-line: $COVERAGE_LINE"
          echo "coverage-branch: $COVERAGE_BRANCH"
          echo "coverage-lines-total: $LINES_TOTAL"
          echo "coverage-lines-covered: $LINES_COVERED"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: tests-total output is empty"
              exit 1
            fi
            if [ -z "$COVERAGE_LINE" ]; then
              echo "FAIL: coverage-line output is empty — coverage-path was not parsed"
              exit 1
            fi
            echo "PASS: coverage-path was parsed, coverage-line=$COVERAGE_LINE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely sentinel repo PR comment failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
