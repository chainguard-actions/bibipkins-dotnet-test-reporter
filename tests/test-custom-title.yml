name: Test custom comment title and show-failed-tests-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          results-path: ${{ github.workspace }}/tests/fixtures/failing_tests.trx
          comment-title: 'My Custom Test Results'
          allow-failed-tests: 'true'
          show-failed-tests-only: 'true'
          post-new-comment: 'false'

      - name: Assert action ran and outputs are set
        env:
          TOTAL: ${{ steps.action.outputs.tests-total }}
          FAILED: ${{ steps.action.outputs.tests-failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tests-total: $TOTAL"
          echo "tests-failed: $FAILED"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOTAL" ]; then
              echo "FAIL: tests-total output is empty"
              exit 1
            fi
            if [ "$TOTAL" != "2" ]; then
              echo "FAIL: expected tests-total=2, got '$TOTAL'"
              exit 1
            fi
            if [ "$FAILED" != "1" ]; then
              echo "FAIL: expected tests-failed=1, got '$FAILED'"
              exit 1
            fi
            echo "PASS: custom title scenario outputs correct"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely sentinel repo PR comment failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
