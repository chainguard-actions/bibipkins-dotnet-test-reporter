name: Test error when no test results found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          results-path: ${{ github.workspace }}/tests/fixtures/nonexistent_path/*.trx
          allow-failed-tests: 'true'
          post-new-comment: 'false'

      - name: Assert action fails when no trx files found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no test results found, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no test results found"
